services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://talentlens:talentlens@postgres:5432/talentlens
      VECTOR_DB_PATH: /data/chroma
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens
      POSTGRES_DB: talentlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentlens -d talentlens"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  chroma_data:
